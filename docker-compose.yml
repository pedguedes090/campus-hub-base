services:
  mysql:
    image: mysql:8.0
    container_name: campus-hub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: campus_hub
      MYSQL_USER: campus_user
      MYSQL_PASSWORD: campus_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - campus_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "campus_user", "-pcampus_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: campus-hub-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-hub-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/campus_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: campus_user
      DB_PASSWORD: campus_password
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - campus_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:

networks:
  campus_network:
    driver: bridge
